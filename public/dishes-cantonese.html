<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典粤菜 | 中华美食</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .gallery-header {
            text-align: center;
            padding: var(--spacing-xl) 0;
            background: var(--bg-white);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .dish-item {
            position: relative;
            height: 300px;
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition: var(--transition-normal);
            background-color: #333;
        }

        .dish-item:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-hover);
            z-index: 10;
        }

        .dish-bg {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: 0.5s;
        }

        .dish-item:hover .dish-bg {
            transform: scale(1.1);
        }

        .dish-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: var(--text-light);
            transform: translateY(0);
            transition: 0.3s;
        }

        .dish-overlay h3 {
            color: var(--bg-white);
        }

        /* Fake Images CSS for Cantonese */
        .img-dimsum { background: radial-gradient(circle, #ecf0f1, #bdc3c7); }
        .img-bbq { background: radial-gradient(circle, #e67e22, #d35400); }
        .img-soup { background: radial-gradient(circle, #f1c40f, #f39c12); }
        .img-chicken { background: radial-gradient(circle, #f39c12, #e67e22); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">🥢 中华美食</a>
            <div class="nav-links">
                <a href="cuisine-cantonese.html">返回介绍</a>
                <a href="index.html">首页</a>
                <a href="contact.html">联系合作</a>
            </div>
        </div>
    </nav>

    <header class="gallery-header">
        <div class="container">
            <h1 style="color: #27ae60;">粤菜经典名菜</h1>
            <p>Photo Wall Collection</p>
        </div>
    </header>

    <main class="container">
        <div class="gallery-grid">
            
            <div class="dish-item" onclick="window.location.href='recipe-dimsum.html'">
                <div class="dish-bg" style="background-image: url('images/dish_dimsum.png');">
                </div>
                <div class="dish-overlay">
                    <h3>广式早茶</h3>
                    <p>Dim Sum</p>
                </div>
            </div>

            <div class="dish-item" onclick="window.location.href='recipe-charsiu.html'">
                <div class="dish-bg" style="background-image: url('images/dish_char_siu.png');">
                </div>
                <div class="dish-overlay">
                    <h3>蜜汁叉烧</h3>
                    <p>Char Siu BBQ Pork</p>
                </div>
            </div>

            

        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div>
                    <h3>关于我们</h3>
                    <p style="margin-top: 10px;">致力于弘扬中华美食文化，让世界了解中国味道。提供最正宗的食谱与烹饪技巧。</p>
                </div>
                <div>
                    <h3>联系方式</h3>
                    <ul style="margin-top: 10px;">
                        <li>📍 地址：北京市朝阳区美食街88号</li>
                        <li>📧 邮箱：contact@chinesecuisine.com</li>
                        <li>📞 电话：010-88888888</li>
                    </ul>
                </div>
                <div>
                    <!-- Spacer -->
                </div>
            </div>
            <div class="copyright">
                <p>&copy; 2024 中华美食网. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
