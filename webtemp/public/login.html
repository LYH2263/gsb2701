<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | 中华美食</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            min-height: calc(100vh - 200px); /* Adjust for header/footer */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-xl) 0;
            background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)), 
                        url('images/pattern-bg.png'); /* Fallback or pattern */
        }

        .auth-card {
            background: var(--bg-white);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 4px solid var(--primary-red);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            color: var(--primary-red);
            font-size: 1.8rem;
        }

        .form-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }

        .form-footer a {
            color: var(--primary-red);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">🥢 中华美食</a>
            <div class="nav-links">
                <a href="index.html">返回首页</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>用户登录</h2>
                <p>欢迎回来，开启您的美食之旅</p>
            </div>
            
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label">用户名 / 邮箱</label>
                    <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">立即登录</button>
            </form>

            <div class="form-footer">
                还没有账号？ <a href="register.html">立即注册</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div>
                    <h3>关于我们</h3>
                    <p style="margin-top: 10px;">致力于弘扬中华美食文化，让世界了解中国味道。提供最正宗的食谱与烹饪技巧。</p>
                </div>
                <div>
                    <h3>联系方式</h3>
                    <ul style="margin-top: 10px;">
                        <li>📍 地址：北京市朝阳区美食街88号</li>
                        <li>📧 邮箱：contact@chinesecuisine.com</li>
                        <li>📞 电话：010-88888888</li>
                    </ul>
                </div>
                <div>
                    <!-- Spacer -->
                </div>
            </div>
            <div class="copyright">
                <p>&copy; 2024 中华美食网. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validation
            let isValid = true;
            isValid = validateRequired('#username', '用户名不能为空') && isValid;
            isValid = validateRequired('#password', '密码不能为空') && isValid;

            if (isValid) {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Save user data for main.js to use
                        localStorage.setItem('user', JSON.stringify(data.user));
                        
                        showModal('登录成功', '欢迎回来！正在跳转...', 'success');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        showModal('登录失败', data.message || '用户名或密码错误', 'error');
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    showModal('系统错误', '无法连接到服务器，请稍后重试', 'error');
                });
            }
        });
    </script>
</body>
</html>
